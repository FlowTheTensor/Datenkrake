services:
  mqtt:
    build: ../mosquitto
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ../mosquitto/data:/mosquitto/data
      - ../mosquitto/log:/mosquitto/log
      - ../mosquitto/config:/mosquitto/config

  db:
    build: ../mariadb
    container_name: mqtt-sql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: changeMeRoot
      MARIADB_DATABASE: telemetry
      MARIADB_USER: sensor
      MARIADB_PASSWORD: changeMeSensor
    ports:
      - "3306:3306"
    volumes:
      - ../mariadb/data:/var/lib/mysql
      - ../mariadb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  subscriber:
    build: ../subscriber
    container_name: mqtt-subscriber
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
      db:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: Raspberry/web/Dockerfile
    container_name: web-server
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_started

  # --- Operational Historian ---------------------------------------------
  # Speichert dieselben audio_spectrum-Messwerte zusätzlich in einer auf
  # Zeitreihen spezialisierten Datenbank (InfluxDB) statt der relationalen
  # MariaDB. Rührt die bestehende Pipeline nicht an - reine Ergänzung.
  # Siehe Raspberry/historian/README.md für die didaktische Einordnung
  # "Historian vs. relationale DB".
  historian:
    image: influxdb:2.7
    container_name: historian
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: changeMeHistorian
      DOCKER_INFLUXDB_INIT_ORG: datenkrake
      DOCKER_INFLUXDB_INIT_BUCKET: telemetrie
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: changeMeHistorianToken
    volumes:
      - ../historian/data:/var/lib/influxdb2

  historian_bridge:
    build: ../historian_bridge
    container_name: historian-bridge
    restart: unless-stopped
    environment:
      MQTT_BROKER: mqtt
      INFLUX_URL: http://historian:8086
      INFLUX_TOKEN: changeMeHistorianToken
      INFLUX_ORG: datenkrake
      INFLUX_BUCKET: telemetrie
    depends_on:
      mqtt:
        condition: service_started
      historian:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.4
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: changeMeGrafana
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ../grafana/data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      historian:
        condition: service_started

  # --- OPC-UA -> Node-RED -> MQTT -----------------------------------------
  # Node-RED liest Tags von einem OPC-UA-Server (S7-1500/ET200SP) und
  # veröffentlicht sie als JSON auf dem bestehenden Mosquitto-Broker.
  # Ohne echte SPS im Netz gegen opcua_demo_server testbar (siehe dort).
  nodered:
    build: ../nodered
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ../nodered/data:/data
    depends_on:
      mqtt:
        condition: service_started

  # Simulierter OPC-UA-Server für den Unterricht, falls keine echte
  # S7-1500/ET200SP im Netz erreichbar ist. Siehe Raspberry/opcua_demo_server/.
  opcua_demo_server:
    build: ../opcua_demo_server
    container_name: opcua-demo-server
    restart: unless-stopped
    ports:
      - "4840:4840"

networks:
  default:
    name: iot-net