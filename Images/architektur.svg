      <text x="240" y="97" font-family="JetBrains Mono" font-size="10" fill="#2A5F8A">MQTT</text>

      <path d="M220,178 L280,132" fill="none" stroke="#2A5F8A" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arNet)"/>
      <text x="222" y="163" font-family="JetBrains Mono" font-size="9.5" fill="#2A5F8A">MQTT (geplant)</text>

      <path d="M220,300 L280,195" fill="none" stroke="#2A5F8A" stroke-width="1.6" marker-end="url(#arNet)"/>
      <text x="228" y="252" font-family="JetBrains Mono" font-size="10" fill="#2A5F8A" transform="rotate(-60 228 252)">OPC-UA</text>

      <!-- Node-RED -> Mosquitto (Bridge publiziert selbst per MQTT) -->
      <path d="M372,166 L372,146" fill="none" stroke="#2A5F8A" stroke-width="1.6" marker-end="url(#arNet)"/>
      <text x="388" y="160" font-family="JetBrains Mono" font-size="9.5" fill="#2A5F8A">MQTT</text>

