        <text x="122" y="30" text-anchor="middle">DATENERHEBUNG</text>
        <text x="550" y="30" text-anchor="middle">VERARBEITEN + BEREITSTELLEN</text>
        <text x="975" y="30" text-anchor="middle">ANALYSE</text>
      </g>

      <!-- Container: Datenkrake Raspberry Pi 5 -->
