      <text x="575" y="480" font-family="JetBrains Mono" font-size="10" fill="#5B5852">A2A</text>

      <path d="M592,464 L738,494" fill="none" stroke="#5B5852" stroke-width="1.6" marker-end="url(#arA2a)"/>
      <text x="668" y="472" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#5B5852">A2A</text>

      <!-- DB-Agent / Report-Agent <-> MariaDB -->
