    <svg viewBox="0 0 1100 760" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>text{font-family:"JetBrains Mono","Quicksand",monospace,sans-serif;}</style>
  <rect x="0" y="0" width="1100" height="760" fill="#FFFFFF"/>
      <title>Systemarchitektur: Datenerhebung, Verarbeitung/Bereitstellung auf der Datenkrake (Raspberry Pi 5) und Analyse</title>
      <desc>Links erheben Akustik-KI, YOLO-System (Arduino UNO Q, per MQTT) und die Modellanlage (per OPC-UA über Node-RED) Rohdaten. In der Mitte bündelt die Datenkrake auf einem Raspberry Pi 5 als Docker-Stack den Mosquitto-Broker, Node-RED als OPC-UA/MQTT-Brücke, den Operational Historian InfluxDB, die MariaDB als vollständige Datenquelle, einen Anomalie-Poller, der zusätzlich Zeitreihenanalysen aus InfluxDB abruft, sowie das Agentensystem aus Orchestrator-, DB-, Wartungs- und Report-Agent, die per A2A kommunizieren; ein Webserver liefert dieses Dashboard aus. Rechts liest ein separater Server/PC per Batch-Import einen Data-Lake-Stack (MinIO, Nessie, Spark/Jupyter) aus der MariaDB, während ein MCP-Server auf einem PC dieselbe MariaDB abfragt und die Daten per MCP sowohl an Claude Desktop als auch an einen eigenständigen Agent Harness weiterreicht, die beide gleichwertig als MCP-Clients auftreten; ein Browser greift per HTTP auf den Webserver zu.</desc>
      <defs>
        <marker id="arMcp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M1 1L8 5L1 9Z" fill="#C81E3A"/>
        </marker>
        <marker id="arA2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M1 1L8 5L1 9Z" fill="#5B5852"/>
        </marker>
        <marker id="arLap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M1 1L8 5L1 9Z" fill="#E4002B"/>
        </marker>
        <marker id="arFeed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M1 1L8 5L1 9Z" fill="#7D7A72"/>
        </marker>
        <marker id="arNet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M1 1L8 5L1 9Z" fill="#2A5F8A"/>
        </marker>
      </defs>

      <!-- Zonen: Dividers + Labels -->
      <line x1="238" y1="50" x2="238" y2="705" stroke="#E7E1D6" stroke-width="1.2" stroke-dasharray="2 4"/>
      <line x1="865" y1="50" x2="865" y2="705" stroke="#E7E1D6" stroke-width="1.2" stroke-dasharray="2 4"/>
