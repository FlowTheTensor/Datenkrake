      <text x="790" y="74" font-family="JetBrains Mono" font-size="9.5" fill="#7D7A72">Batch Import</text>

      <!-- MariaDB -> MCP-Server (SQL übers Netz) -->
      <path d="M818,140 L890,306" fill="none" stroke="#7D7A72" stroke-width="1.6" marker-end="url(#arFeed)"/>
      <text x="843" y="228" font-family="JetBrains Mono" font-size="9.5" fill="#7D7A72" transform="rotate(66 843 228)">SQL (Netzwerk)</text>

