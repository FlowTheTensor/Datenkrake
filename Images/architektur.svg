      <text x="270" y="68" font-family="JetBrains Mono" font-size="10.5" fill="#7D7A72">Datenkrake · Raspberry Pi 5 (Docker-Stack)</text>

      <!-- ================= Verbindungen ================= -->
      <!-- MQTT / OPC-UA (Zone 1 -> Mosquitto/Node-RED) -->
