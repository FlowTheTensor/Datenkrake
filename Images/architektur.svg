      <text x="500" y="330" font-family="JetBrains Mono" font-size="9.5" fill="#7D7A72" transform="rotate(-53 500 330)">SQL</text>

      <path d="M735,494 L795,148" fill="none" stroke="#7D7A72" stroke-width="1.6" marker-start="url(#arFeed)" marker-end="url(#arFeed)"/>
      <text x="768" y="330" font-family="JetBrains Mono" font-size="9.5" fill="#7D7A72" transform="rotate(65 768 330)">SQL</text>

