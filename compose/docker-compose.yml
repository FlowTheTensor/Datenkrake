services:
  mqtt:
    build: ../mosquitto
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ../mosquitto/data:/mosquitto/data
      - ../mosquitto/log:/mosquitto/log
      - ../mosquitto/config:/mosquitto/config

  db:
    build: ../mariadb
    container_name: mqtt-sql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: changeMeRoot
      MARIADB_DATABASE: telemetry
      MARIADB_USER: sensor
      MARIADB_PASSWORD: changeMeSensor
    ports:
      - "3306:3306"
    volumes:
      - ../mariadb/data:/var/lib/mysql
      - ../mariadb/init:/docker-entrypoint-initdb.d

  subscriber:
    build: ../subscriber
    container_name: mqtt-subscriber
    restart: unless-stopped
    depends_on:
      - mqtt
      - db

  mcp:
    build: ../mcp-server
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_USER: mcp_read
      DB_PASSWORD: changeMeMcp
      DB_NAME: telemetry
    depends_on:
      - db

  web:
    build: ../web
    container_name: web-server
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - db

networks:
  default:
    name: iot-net